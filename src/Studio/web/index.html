<meta charset="utf-8">
<title>MFH Studio</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<header>
  <h1>MFH&nbsp;Studio</h1>
  <div class="file">
    <span id="path-label" class="pathlabel"></span>
    <button id="open" data-i18n>Open…</button>
    <button id="save" class="primary" data-i18n>Save</button>
    <button id="saveas" data-i18n>Save as…</button>
  </div>
  <div class="spacer"></div>
  <button id="lang" class="small" title="Language: English or French" data-i18n-title>FR</button>
  <button id="theme" class="small" title="Theme: as the system, light or dark" data-i18n-title>◐</button>
  <!-- the badge and Run are written by the code (the state, a run in progress) -->
  <span id="status" class="badge">…</span>
  <button id="run" class="primary">Run</button>
  <button id="stop" class="small" title="Stop the run" data-i18n data-i18n-title disabled>Stop</button>
  <button id="restart" class="small" title="Restart the compute process" data-i18n data-i18n-title>Restart</button>
</header>

<div id="banner" hidden></div>

<main>
  <!-- ── left: the model ─────────────────────────────────────────── -->
  <section id="left">
    <nav class="tabs">
      <button data-tab="scales" class="on" data-i18n>Scales</button>
      <button data-tab="sweep" data-i18n>Sweep</button>
      <button data-tab="sens" data-i18n>Sensitivity</button>
      <button data-tab="alv" data-i18n>Viscoelastic</button>
      <button data-tab="params" data-i18n>Constants</button>
      <button data-tab="kept" data-i18n>Kept</button>
    </nav>

    <div class="tab on" id="tab-scales">
      <div class="row">
        <select id="cell-select"></select>
        <button id="cell-add" title="Add a scale" data-i18n-title>+</button>
        <button id="cell-del" title="Remove this scale" data-i18n-title>−</button>
      </div>
      <div class="field">
        <label data-i18n>Scale name</label>
        <input id="cell-name" type="text" spellcheck="false">
      </div>
      <div class="field">
        <label data-i18n>Kind</label>
        <select id="cell-kind">
          <option value="rve" data-i18n>RVE (matrix + inclusions)</option>
          <option value="laminate" data-i18n>Laminate (periodic stack)</option>
        </select>
      </div>
      <h3 id="phase-head"><span data-i18n>Phases</span> <button id="phase-add" class="small" data-i18n>+ phase</button></h3>
      <div id="phases"></div>
    </div>

    <div class="tab" id="tab-sweep"></div>
    <div class="tab" id="tab-sens"></div>
    <div class="tab" id="tab-alv"></div>
    <div class="tab" id="tab-params"></div>
    <div class="tab" id="tab-kept"></div>
  </section>

  <div class="gutter gutter-v" data-col="l" title="Drag to resize · double-click to reset" data-i18n-title></div>

  <!-- ── middle: 3-D and results ─────────────────────────────────── -->
  <section id="middle">
    <div class="panel-head" id="graph-head" hidden>
      <span data-i18n>Scales</span>
      <span class="muted" data-i18n>drag a box to move it · drag the blue dot onto a
        property slot to feed it from that scale · click a connector to detach</span>
    </div>
    <div id="graph" class="graph pane" hidden></div>
    <div class="gutter gutter-h" id="gutter-graph" data-above="graph" data-below="view3d" hidden></div>
    <div class="panel-head">
      <span data-i18n>Shape</span>
      <label class="inline"><input type="checkbox" id="cutaway" checked> <span data-i18n>cut-away</span></label>
      <span id="shape-label" class="muted"></span>
    </div>
    <div id="view3d" class="pane"></div>
    <div class="gutter gutter-h" data-above="view3d" data-below="plot"
         title="Drag to resize · double-click to reset" data-i18n-title></div>
    <div class="panel-head"><span data-i18n>Results</span></div>
    <div id="plot" class="pane"></div>
    <!-- stdout sizes itself to its content up to a cap rather than claiming a
         share, so this one handle gives it an explicit height instead. -->
    <div class="gutter gutter-h" data-above="plot" data-below="stdout" data-mode="fixed-below"
         title="Drag to resize · double-click to reset" data-i18n-title></div>
    <pre id="stdout"></pre>
  </section>

  <div class="gutter gutter-v" data-col="r" title="Drag to resize · double-click to reset" data-i18n-title></div>

  <!-- ── right: the script ───────────────────────────────────────── -->
  <section id="right">
    <div class="panel-head">
      <span>Julia</span>
      <span id="problems" class="muted"></span>
    </div>
    <pre id="code"></pre>
  </section>
</main>

<!-- file picker: the browser cannot hand back a real path, and a path is what
     saving to the same file needs, so the server lists its own filesystem -->
<div id="picker" class="modal" hidden>
  <div class="dialog">
    <header>
      <b id="picker-title"></b>
      <button id="picker-close" class="small" title="Close" data-i18n-title>✕</button>
    </header>
    <div class="places" id="picker-places"></div>
    <div class="crumb" id="picker-crumb"></div>
    <div class="listing" id="picker-list"></div>
    <footer>
      <input id="picker-name" type="text" spellcheck="false" placeholder="file name.jl" data-i18n-placeholder>
      <button id="picker-ok" class="primary"></button>
    </footer>
  </div>
</div>

<div id="toast"></div>

<script src="/token.js"></script>
<script src="/i18n.js"></script>
<script src="/vendor/plotly.min.js"></script>
<script src="/picker.js"></script>
<script src="/split.js"></script>
<script src="/graph.js"></script>
<script src="/app.js"></script>
