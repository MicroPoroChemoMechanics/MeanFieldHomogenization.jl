<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 310" width="620" height="310"
     font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Mechanics of one interfoliar layer</title>
  <desc>Two solid platelets separated by an interfoliar layer of thickness h.
  The platelets slide freely on the fluid, which pushes them apart with the
  pore pressure plus a swelling overpressure; linearizing that repulsion gives
  the layer a normal stiffness and nothing else.</desc>

  <defs>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c8792f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="620" height="310" rx="8" fill="#fcfcfd"/>
  <text x="24" y="28" font-size="14.5" font-weight="600" fill="#222">one interfoliar layer — free sliding, normal repulsion only</text>

  <!-- free sliding, above and below -->
  <path d="M 150 50 L 270 50" stroke="#333" stroke-width="1.4" marker-end="url(#ah2)"/>
  <text x="280" y="54" font-size="13" fill="#333">free sliding</text>
  <path d="M 410 272 L 290 272" stroke="#333" stroke-width="1.4" marker-end="url(#ah2)"/>
  <text x="420" y="276" font-size="13" fill="#333">free sliding</text>

  <!-- the two platelets and the layer between them -->
  <rect x="80" y="62"  width="400" height="52" fill="#dce9f8" stroke="#4472a8" stroke-width="1.2"/>
  <text x="280" y="93" font-size="13" fill="#20364f" text-anchor="middle">solid platelet — elastic, incompressible</text>

  <rect x="80" y="114" width="400" height="80" fill="#fdf0e6" stroke="#c8792f" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="280" y="132" font-size="13" fill="#7a4a12" text-anchor="middle">interfoliar space — fluid + ions</text>

  <rect x="80" y="194" width="400" height="52" fill="#dce9f8" stroke="#4472a8" stroke-width="1.2"/>
  <text x="280" y="225" font-size="13" fill="#20364f" text-anchor="middle">solid platelet — elastic, incompressible</text>

  <!-- interfoliar distance h -->
  <path d="M 78 114 L 46 114" stroke="#666" stroke-width="0.9"/>
  <path d="M 78 194 L 46 194" stroke="#666" stroke-width="0.9"/>
  <path d="M 52 114 L 52 194" stroke="#333" stroke-width="1.1" marker-start="url(#ah2)" marker-end="url(#ah2)"/>
  <text x="26" y="159" font-size="14" font-style="italic" fill="#333">h</text>

  <!-- the normal -->
  <path d="M 505 178 L 505 128" stroke="#333" stroke-width="1.4" marker-end="url(#ah2)"/>
  <text x="513" y="157" font-size="14.5" font-style="italic" font-weight="600" fill="#333">n</text>

  <!-- the repulsion pushing the platelets apart -->
  <path d="M 400 154 L 400 120" stroke="#c8792f" stroke-width="1.6" marker-end="url(#ao)"/>
  <path d="M 400 154 L 400 188" stroke="#c8792f" stroke-width="1.6" marker-end="url(#ao)"/>
  <text x="414" y="159" font-size="13.5" fill="#7a4a12">p + π<tspan dy="-5" font-size="10">g</tspan></text>

  <!-- linearized: a normal spring, and nothing else -->
  <path d="M 170 114 L 170 126 L 156 132 L 184 144 L 156 156 L 184 168 L 170 174 L 170 194"
        fill="none" stroke="#c8792f" stroke-width="2"/>
  <text x="194" y="159" font-size="14" font-weight="600" font-style="italic" fill="#7a4a12">Π</text>
  <text x="80" y="292" font-size="13" fill="#555">linearized around h₀, the layer has a normal stiffness Π and no other stiffness at all</text>
</svg>
