[compat]
ChemistryLab = "0.7.1"
# The ionic chapter calls `_budget_clip!` and `_restore_feasibility!`, which
# appeared in ChemistryLab 0.7.1. A bound of "0.7" also admits 0.7.0, where they
# do not exist: locally the dev copy hides that, while CI resolves 0.7.0 from the
# registry and every `@example` of the chapter throws `UndefVarError` — which
# `warnonly = true` turns into a page of code with no output and no visible
# error. Pin the patch, not just the minor.
#
# The equilibrium back-end of the ionic chapter. Keep in step with the bound
# ChemistryLab itself declares, or the docs env silently resolves an older
# OptimaOptimizer without `use_fd_hessian`/`nullspace_step`.
OptimaSolver = "0.2.6"

[sources]
MeanFieldHomogenization = {path = ".."}
