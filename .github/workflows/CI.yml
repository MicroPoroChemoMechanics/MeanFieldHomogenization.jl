name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.part }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          # Aliases, so that no release of Julia calls for an edit here: 'min' is
          # the latest patch of the oldest minor that `julia` admits in
          # Project.toml, '1' the latest release, which also measures the
          # coverage (keep it, or move the coverage conditions below with it),
          # and 'pre' the latest prerelease.
          - 'min'
          - '1'
          - 'pre'
        # The suite runs in four parts (`TEST_PARTS` in test/runtests.jl). Whole,
        # it took 52 to 85 minutes depending on the runner, and the coverage job
        # crossed the 90-minute timeout; each part is a fraction of that.
        part:
          - 'core'
          - 'schemes'
          - 'patterns'
          - 'visco-neural'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        id: julia
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      # The machine the job runs on: the processor and its vector extensions,
      # and what Julia makes of them. A crash inside the compiler can depend on
      # the target it generates code for, which no other line of the log names.
      - name: Machine
        shell: bash
        run: |
          lscpu | grep -E '^(Model name|CPU\(s\)|Thread|Core|Socket)'
          grep -o -w -E 'avx2|avx512[a-z_0-9]*|amx[a-z_0-9]*' /proc/cpuinfo | sort -u | tr '\n' ' '; echo
          julia --startup-file=no -e 'using InteractiveUtils; versioninfo()'
      # One depot cache per Julia version, shared by the four parts, which install
      # and precompile the same test environment. A cache per part made twelve,
      # which with those of the documentation overflowed the 10 GB a repository
      # may hold: the caches evicted each other and jobs started from a cold
      # depot, precompiling every dependency again. The key also names the
      # installed version, since the aliases of the matrix stay the same when
      # Julia changes: a new release starts its own depot instead of carrying the
      # old `compiled/` along.
      - uses: julia-actions/cache@v3
        with:
          cache-name: julia-cache;workflow=${{ github.workflow }};job=${{ github.job }};version=${{ matrix.version }};julia=${{ steps.julia.outputs.julia-version }}
          include-matrix: false
      # The Pkg server intermittently advertises a General tree hash that its
      # CDN then answers with a 404, which kills the first `Pkg.add` of a cold
      # depot before any of this repository's code runs.  Install the registry
      # up front and fall back to a direct clone when that happens; package
      # tarballs keep going through the Pkg server either way.
      - name: Install the General registry
        shell: julia --color=yes {0}
        run: |
          using Pkg
          regdir = joinpath(first(DEPOT_PATH), "registries")
          if isdir(joinpath(regdir, "General")) || isfile(joinpath(regdir, "General.tar.gz"))
              @info "General registry already installed"
          else
              try
                  Pkg.Registry.add("General")
              catch err
                  @warn "Pkg server could not serve the registry; cloning from GitHub" err
                  withenv("JULIA_PKG_SERVER" => "") do
                      Pkg.Registry.add(Pkg.RegistrySpec(url = "https://github.com/JuliaRegistries/General.git"))
                  end
              end
          end
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          test_args: ${{ matrix.part }}
          # Instrument only the jobs on the latest release: coverage disables
          # precompilation caching and would slow down every other matrix entry
          # for nothing.
          coverage: ${{ matrix.version == '1' }}
      # The coverage of the four parts is merged before it is processed, into one
      # report. Processed part by part, a file that a part never runs counts every
      # executable line as missed, and the union Codecov takes of the reports then
      # flags the lines Julia never instruments (a one-line method with a constant
      # body, a method generated by an `@eval` loop) wherever another part does run
      # the file. Each part keeps its raw `.cov` files instead, tagged with its name
      # so that two runners reusing a process id cannot overwrite each other's.
      - name: Tag the coverage files with the part
        if: matrix.version == '1'
        run: |
          find src ext -name '*.cov' -print0 |
            while IFS= read -r -d '' f; do mv "$f" "${f%.cov}.${{ matrix.part }}.cov"; done
      - uses: actions/upload-artifact@v7
        if: matrix.version == '1'
        with:
          name: coverage-${{ matrix.part }}
          path: |
            src/**/*.cov
            ext/**/*.cov
          if-no-files-found: error
          retention-days: 1
  coverage:
    name: Coverage
    needs: test
    # Runs once the matrix is done, whatever its outcome, and uploads only when
    # all four parts produced coverage, which a part does only when its tests
    # pass: a report lacking a part would show the lines only that part runs as
    # missed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read # the artifacts of the test jobs
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-parts
      - name: Merge the parts
        id: merge
        run: |
          # The four values of `matrix.part` above.
          n=$(find coverage-parts -mindepth 1 -maxdepth 1 -type d | wc -l)
          if [ "$n" -eq 4 ]; then
            for d in coverage-parts/*/; do cp -r "$d". .; done
            echo "complete=true" >> "$GITHUB_OUTPUT"
          elif [ "$n" -eq 0 ]; then
            # Either every part failed, or no job of the matrix satisfies the
            # coverage conditions any more, which would otherwise go unnoticed.
            echo "::error::no test part produced coverage"
            exit 1
          else
            echo "::warning::coverage from $n of the 4 test parts: nothing uploaded"
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi
      # Not julia-actions/julia-processcoverage: see the header of the script
      # for why its `amend_coverage_from_src!` step misreports this package.
      # MFH Studio is left to Studio.yml, which runs its compute process: see
      # the header of the script.
      - name: Process coverage
        if: steps.merge.outputs.complete == 'true'
        run: |
          julia --color=yes -e 'using Pkg; Pkg.activate(; temp = true); Pkg.add("Coverage"); include(".github/scripts/coverage.jl")' \
            lcov.info src ext --exclude src/studio
      - uses: codecov/codecov-action@v7
        if: steps.merge.outputs.complete == 'true'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
