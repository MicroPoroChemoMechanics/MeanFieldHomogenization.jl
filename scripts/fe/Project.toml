# Environment for the finite-element demonstration scripts (81, 82, 83, 88)
# and for the hand-run figure makers next to them.
#
# `Ferrite`, `FerriteGmsh` and `Gmsh` are *weak* dependencies of
# `MeanFieldHomogenization`, so they are not loadable from the package's own environment —
# hence this small dedicated project, which the scripts activate and
# instantiate on first run.
[deps]
Ferrite = "c061ca5d-56c9-439f-9c0e-210fe06d3992"
FerriteGmsh = "4f95f4f8-b27c-4ae5-9a39-ea55e634e36b"
Gmsh = "705231aa-382f-11e9-3f0c-b7cb4346fdeb"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
MeanFieldHomogenization = "c1e5f8a3-7b2d-4a6c-9e4f-3b8a2c5d7e9f"
Plots = "91a5bcdd-55d7-5caf-9e0b-520d859cae80"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
TensND = "474b5345-2588-4284-8a58-2430a1a40cb0"
Tensors = "48a634ad-e948-5137-8d70-aa71f2a747f4"

[sources]
MeanFieldHomogenization = {path = "../.."}
